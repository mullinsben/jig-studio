<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Inline image at 100%</title><style>
body{font:15px/1.5 Georgia,serif;margin:0;padding:24px;max-width:760px}
.post-summary img{width:100%}            /* Blogger's featured-post widget: an inline <img> sized by CSS, with a title and blurb beside it */
.card{float:left;width:220px;margin:0 12px 12px 0}.card img{width:100%;height:140px;object-fit:cover}.card .badge{position:absolute;margin:-10px 0 0 200px;background:#e33;color:#fff;padding:2px 6px;font-size:11px}
.row{clear:both}
</style></head><body>
<h1>Inline images</h1>
<div class="post-summary"><h3><a href="#">Colder and snowier than normal</a></h3><p>A short blurb under the title, then the picture.</p><img class="image" src="layers-dark.jpg" alt="clouds"></div>
<div class="row"></div>
<div class="card"><img src="layers-bright.jpg" alt="bright"><span class="badge">NEW</span><p>A card whose badge hangs outside the picture.</p></div>
<div class="card"><img src="layers-dark.jpg" alt="dark"><p>Another card.</p></div>
<p class="row">Text after the cards, so page height depends on everything above.</p>
<script src="../jig.js"></script></body></html>
