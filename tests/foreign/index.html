<!doctype html><html><head><meta charset="utf-8"><title>Loud CSS</title>
<style>body{margin:0;font-family:Arial}button{text-transform:uppercase;letter-spacing:.2em;border:3px solid red;border-radius:0;font-family:"Comic Sans MS"}h5,h6{text-transform:uppercase;letter-spacing:.3em}input{border:4px dashed lime}
main{max-width:1000px;margin:0 auto;padding:23px 0}h2{font-size:27px;margin:0 0 9px}p{font-size:15.5px;margin:0 0 13px;padding:7.2px 11px}.card{padding:17px 19px;margin-bottom:21px;border:1px solid #ddd}.small{font-size:13.4px}</style></head>
<body><main>
<div class="card"><h2>Card one</h2><p>Body copy with odd numbers everywhere so quantize has work to do here on this page.</p><p class="small">fine print</p></div>
<div class="card"><h2>Card two</h2><p>More body copy with more odd numbers for the quantizer to clean up, nice and long.</p></div>
<div class="card"><h2>Card three</h2><p>A third paragraph to make body-size inference confident about fifteen and a half.</p></div>
</main><p><img id="noalt" src="http://localhost:8765/demo/assets/card-duck.jpg" width="200" height="200"> <img id="filealt" src="http://localhost:8765/demo/assets/herd-bird.jpg" alt="herd-bird.jpg" width="200" height="200"> <img src="http://localhost:8765/demo/assets/herd-yuzu.jpg" alt="" width="200" height="200"></p></body></html>
