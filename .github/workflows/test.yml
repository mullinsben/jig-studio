name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: keep the zero-pixel diffs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zeropixel-diffs
          path: tests/zeropixel-out/
          if-no-files-found: ignore
